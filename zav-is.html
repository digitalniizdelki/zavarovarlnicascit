<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10253D">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ŠČIT — Zavarovalniški informacijski sistem</title>
<style>
:root{
  --navy:#10253D; --paper:#F5F2EA; --panel:#FFFFFF;
  --steel:#3C6E8F; --amber:#C97C2E; --forest:#3F6B4F; --rust:#A3432F;
  --ink:#1B1B18; --mute:#6B6558; --line:#E4DED0;
}
*{box-sizing:border-box;}
html,body{height:100%; margin:0;}
body{background:var(--paper); color:var(--ink); font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; display:flex;}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif; margin:0 0 4px;}
.app{display:flex; width:100%; min-height:100vh;}
.side{width:240px; flex:0 0 240px; background:var(--navy); color:#EDEAE2; padding:22px 14px; display:flex; flex-direction:column; gap:2px;}
.brand{font-family:Georgia,serif; font-size:22px; padding:0 10px 18px; border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:14px;}
.brand small{display:block; font-family:-apple-system,sans-serif; font-size:11px; color:#9FB4C8; margin-top:2px;}
.nav-btn{all:unset; cursor:pointer; padding:9px 12px; border-radius:6px; font-size:13.3px; color:#CFE0EE; display:flex; gap:10px; align-items:center;}
.nav-btn:hover{background:rgba(255,255,255,.06);}
.nav-btn.active{background:var(--steel); color:#fff;}
.side-foot{margin-top:auto; font-size:11.5px; color:#BFD0DE; padding:10px;}
.side-foot button{all:unset; cursor:pointer; color:#9FB4C8; text-decoration:underline; font-size:11px;}
main{flex:1; min-width:0; padding:26px 34px;}
.topbar{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
.topbar p{color:var(--mute); margin:2px 0 0; font-size:14px;}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
.toolbar input[type=text]{padding:8px 10px; border:1px solid var(--line); border-radius:7px; font:inherit; background:var(--panel); min-width:180px;}
button.btn{font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:8px 14px; border-radius:7px; font-size:13px;}
button.btn.primary{background:var(--steel); color:#fff; border-color:var(--steel);}
button.btn.danger{color:var(--rust); border-color:#e2c9c2;}
button.btn:hover{filter:brightness(1.06);}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:22px;}
.kpi{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px;}
.kpi .num{font-family:Georgia,serif; font-size:26px;}
.kpi .lbl{color:var(--mute); font-size:12.5px; margin-top:4px;}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:20px; overflow-x:auto;}
.panel h3{font-size:16px; margin-bottom:12px;}
table{width:100%; border-collapse:collapse; font-size:13.2px; min-width:520px;}
th{text-align:left; color:var(--mute); font-weight:600; font-size:11.2px; padding:8px 9px; border-bottom:1px solid var(--line);}
td{padding:8px 9px; border-bottom:1px solid var(--line); vertical-align:top;}
tr:last-child td{border-bottom:none;}
.tag{padding:3px 9px; border-radius:20px; font-size:11.2px; display:inline-block; white-space:nowrap;}
.tag.ok{background:#E4EFE6; color:var(--forest);}
.tag.wait{background:#F6E9D8; color:var(--amber);}
.tag.risk{background:#F3DEDA; color:var(--rust);}
.rowbtn{all:unset; cursor:pointer; font-size:11.8px; color:var(--steel); margin-right:8px; white-space:nowrap;}
.rowbtn.danger{color:var(--rust);}
.note{color:var(--mute); font-size:12.5px; margin-top:6px;}
.two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:20px;}
.region-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px;}
.regionbox{border:1px solid var(--line); border-radius:10px; padding:14px; background:var(--panel);}
.regionbox b{font-family:Georgia,serif; font-size:20px; display:block;}
.bars{display:flex; align-items:flex-end; gap:10px; height:120px; padding-top:10px;}
.bar{flex:1; background:linear-gradient(var(--steel),var(--navy)); border-radius:4px 4px 0 0; position:relative;}
.bar span{position:absolute; top:-18px; left:0; right:0; text-align:center; font-size:11px; color:var(--mute);}
.bar em{position:absolute; bottom:-20px; left:0; right:0; text-align:center; font-size:11px; font-style:normal; color:var(--mute);}
@media (max-width:900px){ .two-col{grid-template-columns:1fr;} .side{width:70px; flex-basis:70px;} .side .lbltext,.brand small,.side-foot{display:none;} .brand{font-size:0;} .brand:before{content:'Š'; font-size:22px;} }

.overlay{position:fixed; inset:0; background:rgba(16,37,61,.45); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow:auto;}
.overlay.show{display:flex;}
.box{background:var(--panel); border-radius:10px; padding:24px; width:100%; max-width:460px;}
.box h3{margin-bottom:14px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; color:var(--mute); margin-bottom:4px;}
.field input,.field textarea,.field select{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font:inherit; background:var(--paper); color:var(--ink);}
.field textarea{min-height:70px;}
.box .actions{display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap;}
.hr{border:none; border-top:1px solid var(--line); margin:16px 0;}
.log{font-size:12px; color:var(--mute); margin-top:8px; white-space:pre-wrap;}
.admin-fab{position:fixed; top:18px; right:22px; z-index:40; display:flex; gap:8px;}

.login-wrap{position:fixed; inset:0; background:var(--navy); display:none; align-items:center; justify-content:center; z-index:200;}
.login-wrap.show{display:flex;}
.login-card{background:var(--panel); padding:30px; border-radius:12px; width:100%; max-width:340px;}
.err{color:var(--rust); font-size:12.5px; margin-top:8px;}

@media print{ .side,.admin-fab,.toolbar,.rowbtn{display:none !important;} main{padding:0;} .panel{border:none;} }

/* ===== NOV IZGLED ===== */
:root{--navy2:#0B1B2E;--r:12px;--sh:0 1px 2px rgba(16,37,61,.06),0 4px 14px rgba(16,37,61,.06);}
body{font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;background:#F3F1EA;}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);padding:0 0 12px;gap:0;scrollbar-width:thin;scrollbar-color:#3C6E8F transparent;box-shadow:2px 0 18px rgba(11,27,46,.25);}
.side::-webkit-scrollbar{width:6px}.side::-webkit-scrollbar-thumb{background:#3C6E8F;border-radius:6px}
.brand{position:sticky;top:0;z-index:2;background:var(--navy);padding:20px 22px 14px;margin:0 0 6px;border-bottom:1px solid rgba(255,255,255,.1);letter-spacing:.5px}
.brand:before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--amber);margin-right:9px}
#navwrap{padding:0 12px}
.nav-grp{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:#7E9AB3;padding:16px 10px 6px;font-weight:700}
.nav-btn{all:unset;box-sizing:border-box;display:flex!important;width:100%;align-items:center;gap:11px;cursor:pointer;padding:9px 12px;margin:1px 0;border-radius:8px;font-size:13.2px;color:#C9DAE8;border-left:3px solid transparent;transition:background .15s,color .15s}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-btn:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.nav-btn.active{background:rgba(60,110,143,.55);color:#fff;border-left-color:var(--amber);font-weight:600}
.nav-btn .ic{width:22px;height:22px;flex:0 0 22px;display:grid;place-items:center;border-radius:6px;background:rgba(255,255,255,.07);font-size:12px}
.nav-btn.active .ic{background:var(--amber);color:#fff}
.side-foot{margin:14px 12px 0;padding:12px;border-radius:10px;background:rgba(255,255,255,.06);line-height:1.6}
main{padding:30px 38px 60px;max-width:1500px}
.topbar{padding-right:90px;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-size:26px;color:var(--navy)}
.kpi,.panel,.regionbox{box-shadow:var(--sh);border-radius:var(--r);border-color:#E7E2D5}
.kpi{border-top:3px solid var(--steel)}
th{background:#F7F5EE;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0}
tbody tr:hover td{background:#FAF8F2}
td{padding:10px 9px}
button.btn{border-radius:8px;font-weight:500;transition:all .15s}
button.btn.primary{background:linear-gradient(180deg,#457a9c,var(--steel));box-shadow:0 1px 3px rgba(60,110,143,.4)}
button.btn:disabled{opacity:.5;cursor:not-allowed}
.rowbtn:hover{text-decoration:underline}
.toolbar input[type=text],.toolbar select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.admin-fab{top:16px;right:20px}
.overlay{backdrop-filter:blur(3px);padding:24px 12px;align-items:flex-start}
.box{border-radius:14px;box-shadow:0 20px 60px rgba(11,27,46,.35);padding:0;overflow:hidden;max-width:820px}
.box.narrow{max-width:460px}
.box>h3,.box>p,.box>.field,.box>.actions,.box>div:not(.fgrid){margin-left:26px;margin-right:26px}
.box>h3{margin-top:22px}
.fhead{background:linear-gradient(135deg,var(--navy),#1d4466);color:#fff;padding:20px 26px;margin:0!important}
.fhead h3{margin:0;font-size:18px}.fhead small{color:#B9CCDB}
.fbody{padding:8px 26px 4px;max-height:66vh;overflow:auto}
.fsec{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--steel);font-weight:700;margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}
.fgrid .field.wide{grid-column:1/-1}
.field input,.field textarea,.field select{background:#fff;border:1px solid #D6D0BF;padding:9px 11px;transition:border .15s,box-shadow .15s}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--steel);box-shadow:0 0 0 3px rgba(60,110,143,.18)}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--rust);background:#FDF6F4}
.field .em{color:var(--rust);font-size:11.5px;margin-top:3px;display:none}.field.bad .em{display:block}
.field label i{color:var(--rust);font-style:normal}
.box .actions{padding:14px 26px;margin:14px 0 0!important;background:#F7F5EE;border-top:1px solid var(--line)}
.box>.actions:only-child{margin-left:0}
.login-card{box-shadow:0 20px 60px rgba(0,0,0,.4);border-top:4px solid var(--amber)}
@media(max-width:900px){.side{width:72px;flex-basis:72px}.nav-grp{font-size:0;padding:8px 0;border-top:1px solid rgba(255,255,255,.08);margin-top:6px}.nav-btn{justify-content:center;padding:9px 0}.nav-btn .ic{background:none}.fgrid{grid-template-columns:1fr}main{padding:20px 14px 60px}.topbar{padding-right:0;padding-top:40px}}
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap"><div class="login-card">
  <h3>ŠČIT — prijava</h3>
  <p class="note">Preprosta prijava po vlogah, brez šifriranja — primerna za osebno/interno rabo, ne za javno izpostavljen sistem.</p>
  <div class="field"><label>Uporabniško ime</label><input id="li_user" placeholder="npr. admin"></div>
  <div class="field"><label>Geslo</label><input id="li_pass" type="password"></div>
  <button class="btn primary" style="width:100%" onclick="tryLogin()">Prijava</button>
  <div class="err" id="li_err"></div>
  <p class="note">Demo račun: uporabniško ime <b>admin</b>, geslo <b>admin123</b> (uredi ali dodaj uporabnike v modulu Uporabniki).</p>
</div></div>

<div class="admin-fab">
  <button class="btn primary" onclick="openAdmin()">Admin</button>
</div>
<div class="app">
  <nav class="side"><div class="brand">ŠČIT<small>Zavarovalniški IS — Nova generacija</small></div>
    <div id="navwrap"></div>
    <div class="side-foot" id="sidefoot"></div>
  </nav>
  <main id="main"></main>
</div>

<div class="overlay" id="formOverlay"><div class="box" id="formBox"></div></div>
<div class="overlay" id="adminOverlay"><div class="box narrow" id="adminBox" style="max-width:560px"></div></div>

<script>
/* ================= VLOGE ================= */
const ROLES = ['admin','vodja','zastopnik','racunovodja','cenilec'];
let session = null;
try{ session = JSON.parse(sessionStorage.getItem('zavis_session')); }catch(e){}

/* ================= SHEMA MODULOV ================= */
const schemas = {

/* ================= POMOŽNE FUNKCIJE ================= */
const $=s=>document.querySelector(s);
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function statusTag(v){
  const s=String(v||'').toLowerCase();
  if(/tvegan|preiskav|zamud|visoko|risk|nujn|poteklo|zavrn/.test(s)) return 'risk';
  if(/obnov|cenit|obravnav|srednj|odprto|wait|preklic|nov stik|ponudba|osnutek|poslana|načrt|deloma/.test(s)) return 'wait';
  return 'ok';
}
function tagHtml(v){ return `<span class="tag ${statusTag(v)}">${esc(v)}</span>`; }
function parseDateSl(str){
  const m=/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(String(str||'').trim());
  if(!m) return null;
  return new Date(+m[3], +m[2]-1, +m[1]);
}
function fmtDateSl(d){ return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear(); }

function moduleAllowed(m){
  if(session && session.vloga==='stranka') return m.id==='portal';
  return m.roles==='all' || (session && m.roles.includes(session.vloga));
}
function showLogin(){ $('#loginWrap').classList.add('show'); }
function tryLogin(){
  const u=$('#li_user').value.trim(), p=$('#li_pass').value;
  const staff = state.uporabniki.find(r=>r.uporabnisko===u && r.geslo===p && /aktiv/i.test(r.status));
  const cust = !staff && state.strankeRacuni.find(r=>r.uporabnisko===u && r.geslo===p && /aktiv/i.test(r.status));
  const rec = staff || cust;
  if(!rec){ $('#li_err').textContent='Napačno uporabniško ime ali geslo, ali uporabnik ni aktiven.'; return; }
  session = staff ? {ime:rec.ime, uporabnisko:rec.uporabnisko, vloga:rec.vloga} : {ime:rec.ime, uporabnisko:rec.uporabnisko, vloga:'stranka', poveznaStranka:rec.poveznaStranka};
  sessionStorage.setItem('zavis_session', JSON.stringify(session));
  logAction('prijava', session.ime+' ('+session.vloga+')'); persist();
  $('#loginWrap').classList.remove('show');
  boot();
}
function logout(){ sessionStorage.removeItem('zavis_session'); location.reload(); }

/* ================= CRUD: ISKANJE, TABELA, OBRAZEC ================= */
const searchState = {};
function extraActionsHtml(schemaKey, r){
  let out='';
  if(schemaKey==='premije' && r.status!=='plačano') out+=`<button class="rowbtn" data-invoice="${r._id}">Ustvari račun</button><button class="rowbtn" data-pay="${r._id}">Plačaj (simulacija)</button>`;
  if(schemaKey==='stranke' && /poslovna/i.test(r.segment)) out+=`<button class="rowbtn" data-ajpes="${r._id}">Preveri v AJPES</button>`;
  if(schemaKey==='police' && !r.podpis) out+=`<button class="rowbtn" data-sign="${r._id}">Podpiši (e-podpis)</button>`;
  if((schemaKey==='police'||schemaKey==='skode') && r.priloge && r.priloge.length) out+=`<span class="note" style="margin-right:8px">📎${r.priloge.length}</span>`;
  if(schemaKey==='ponudbe'){
    out+=`<button class="rowbtn" data-offerpdf="${r._id}">PDF</button>`;
    if(!/sprejeta|zavrn/i.test(r.status)) out+=`<button class="rowbtn" data-offer2pol="${r._id}">Pretvori v polico</button>`;
  }
  return out;
}
function rowsHtml(schemaKey, rows){
  const sch=schemas[schemaKey];
  if(!rows.length) return `<tr><td colspan="${sch.fields.length+1}" class="note">Ni zadetkov.</td></tr>`;
  return rows.map(r=>`<tr>${sch.fields.map(f=>`<td>${f.tag?tagHtml(r[f.k]):esc(r[f.k])}</td>`).join('')}
    <td>${extraActionsHtml(schemaKey,r)}<button class="rowbtn" data-edit="${r._id}" data-schema="${schemaKey}">Uredi</button><button class="rowbtn danger" data-del="${r._id}" data-schema="${schemaKey}">Izbriši</button></td></tr>`).join('');
}
function filteredRows(schemaKey){
  const term=(searchState[schemaKey]||'').toLowerCase();
  const sch=schemas[schemaKey];
  return state[schemaKey].filter(r=>!term || sch.fields.some(f=>String(r[f.k]||'').toLowerCase().includes(term)));
}
function onSearch(schemaKey, val){
  searchState[schemaKey]=val;
  const tb=document.getElementById('tbody-'+schemaKey);
  if(tb) tb.innerHTML = rowsHtml(schemaKey, filteredRows(schemaKey));
}
function exportCsv(schemaKey){
  const sch=schemas[schemaKey];
  const head=sch.fields.map(f=>f.l).join(';');
  const lines=state[schemaKey].map(r=>sch.fields.map(f=>String(r[f.k]==null?'':r[f.k]).replace(/;/g,',')).join(';'));
  const csv='\uFEFF'+[head,...lines].join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=schemaKey+'.csv'; a.click();
}
function renderCrudTable(modKey){
  const schemaKey = modules.find(m=>m.id===modKey).schema || modKey;
  const sch=schemas[schemaKey];
  return `
  <div class="toolbar">
    <button class="btn primary" onclick="openForm('${schemaKey}')">+ Dodaj zapis</button>
    <input type="text" placeholder="Išči po vseh poljih..." oninput="onSearch('${schemaKey}',this.value)">
    <button class="btn" onclick="exportCsv('${schemaKey}')">Izvozi v Excel (CSV)</button>
    <button class="btn" onclick="window.print()">Izvozi v PDF (natisni)</button>
  </div>
  <div class="panel"><table><thead><tr>${sch.fields.map(f=>`<th>${f.l}</th>`).join('')}<th></th></tr></thead>
  <tbody id="tbody-${schemaKey}">${rowsHtml(schemaKey, filteredRows(schemaKey))}</tbody></table></div>`;
}
let formAttachments=[];
function renderAttachList(){
  if(!formAttachments.length) return '<p class="note">Ni priponk.</p>';
  return formAttachments.map((a,i)=>`<p style="font-size:12.5px"><a href="${a.dataUrl}" download="${esc(a.name)}">${esc(a.name)}</a> <button class="rowbtn danger" data-rmattach="${i}">Odstrani</button></p>`).join('');
}
function addAttachments(ev){
  const files=[...ev.target.files]; let pending=files.length;
  files.forEach(f=>{
    if(f.size>1500000){ alert(f.name+' je prevelika (največ 1,5 MB na datoteko).'); if(--pending===0) $('#attachList').innerHTML=renderAttachList(); return; }
    const r=new FileReader();
    r.onload=()=>{ formAttachments.push({name:f.name, dataUrl:r.result}); if(--pending===0) $('#attachList').innerHTML=renderAttachList(); };
    r.readAsDataURL(f);
  });
}

function toIso(v){ const d=parseDateSl(v); return d? d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') : ''; }
function fromIso(v){ if(!v) return ''; const [y,m,d]=v.split('-'); return d+'.'+m+'.'+y; }
function fieldHtml(f,val){
  const wide=f.type==='textarea'; const req=f.req?' <i>*</i>':''; let inp;
  if(f.type==='textarea') inp=`<textarea data-k="${f.k}" rows="3">${esc(val)}</textarea>`;
  else if(f.type==='select'){ const o=[...f.opts]; if(val&&!o.includes(val)) o.unshift(val); inp=`<select data-k="${f.k}"><option value="">— izberi —</option>${o.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('')}</select>`; }
  else if(f.type==='date') inp=`<input type="date" data-k="${f.k}" data-date="1" value="${toIso(val)}">`;
  else if(f.type==='number') inp=`<input type="number" step="any" data-k="${f.k}" value="${esc(val)}">`;
  else inp=`<input type="${f.type==='email'?'email':f.type==='tel'?'tel':f.k==='geslo'?'text':'text'}" data-k="${f.k}" value="${esc(val)}" autocomplete="off">`;
  return `<div class="field ${wide?'wide':''}" data-f="${f.k}"><label>${f.l}${req}</label>${inp}<div class="em"></div></div>`;
}
function openForm(schemaKey,id){
  const sch=schemas[schemaKey]; const rec=id?state[schemaKey].find(r=>r._id===id):{};
  const hasAttach=(schemaKey==='police'||schemaKey==='skode'); formAttachments=(rec.priloge||[]).slice();
  $('#formBox').className='box'; const secs=sch.sections.map(s=>`<div class="fsec">${esc(s)}</div><div class="fgrid">${sch.form.filter(f=>f.s===s).map(f=>fieldHtml(f,rec[f.k])).join('')}</div>`).join('');
  $('#formBox').className='box'; $('#formBox').innerHTML=`<div class="fhead"><h3>${id?'Uredi zapis':'Nov zapis'} — ${sch.label}</h3><small>Polja z * so obvezna.</small></div>
  <div class="fbody">${secs}${hasAttach?`<div class="fsec">Priponke</div><div class="field"><label>Fotografije, skenirane pogodbe, dokazila (PDF/slike, do 1,5 MB)</label><input type="file" multiple accept="image/*,.pdf" onchange="addAttachments(event)"><div id="attachList" style="margin-top:8px">${renderAttachList()}</div></div>`:''}</div>
  <div class="actions"><button class="btn" onclick="closeOverlay('formOverlay')">Prekliči</button><button class="btn primary" onclick="saveForm('${schemaKey}','${id||''}')">Shrani</button></div>`;
  $('#formOverlay').classList.add('show'); const fi=document.querySelector('#formBox input,#formBox select'); if(fi&&!id) fi.focus();
}
function validateForm(sch){
  let ok=true; const emailRe=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
  sch.form.forEach(f=>{ const w=document.querySelector(`#formBox [data-f="${f.k}"]`); const el=w&&w.querySelector('[data-k]'); if(!el) return; const v=el.value.trim(); let m='';
    if(f.req&&!v) m='To polje je obvezno.'; else if(v&&f.type==='email'&&!emailRe.test(v)) m='Neveljaven e-poštni naslov.'; else if(v&&f.type==='number'&&isNaN(+v)) m='Vnesi število.';
    else if(f.k==='ocena'&&v&&(+v<0||+v>10)) m='Ocena mora biti med 0 in 10.';
    w.classList.toggle('bad',!!m); w.querySelector('.em').textContent=m; if(m) ok=false; });
  if(!ok){ const b=document.querySelector('#formBox .bad'); if(b) b.scrollIntoView({block:'center'}); } return ok;
}
function saveForm(schemaKey, id){
  const sch=schemas[schemaKey];
  if(!validateForm(sch)) return;
  const obj={};
  sch.form.forEach(f=>{ const el=document.querySelector(`#formBox [data-k="${f.k}"]`); if(!el) return; obj[f.k]=el.dataset.date? fromIso(el.value) : el.value.trim(); });
  if(schemaKey==='police'||schemaKey==='skode') obj.priloge = formAttachments.slice();
  if(schemaKey==='skode'){
    const prej = id ? state.skode.find(r=>r._id===id) : null;
    const bilaNujna = prej ? /nujn/i.test(prej.prioriteta||'') : false;
    if(/izpla/i.test(obj.faza) && amountNum(obj.vrednost)>PRAG_STIRI_OCI && !(prej && prej.vrednost===obj.vrednost && jeDvojnoOdobrena(prej))){
      alert('Izplačilo nad '+PRAG_STIRI_OCI+' € zahteva odobritev dveh različnih oseb (načelo štirih oči). Odobritve dodaš v modulu "Izplačila škod".'); return;
    }
    obj.prioriteta = amountNum(obj.vrednost)>50000 ? 'nujno' : (obj.prioriteta||'redno');
    if(obj.prioriteta==='nujno' && !bilaNujna){
      state.naloge.push({_id:uid(), naslov:'Nujna škoda '+(obj.id||'')+' presega prag 50.000 € — takoj pregledati', zadolzen:'Vodja', rok:fmtDateSl(new Date(Date.now()+86400000)), status:'odprto'});
      logAction('Samodejna eskalacija','Škoda '+(obj.id||'')+' označena kot nujna in dodeljena vodji');
    }
  }
  if(id){ Object.assign(state[schemaKey].find(r=>r._id===id), obj); logAction('Urejeno', schemas[schemaKey].label+' — '+id); }
  else{ obj._id=uid(); state[schemaKey].push(obj); logAction('Dodano', schemas[schemaKey].label); }
  persist(); closeOverlay('formOverlay'); renderMain();
}
function deleteRecord(schemaKey,id){
  if(!confirm('Izbrišem ta zapis?')) return;
  state[schemaKey]=state[schemaKey].filter(r=>r._id!==id);
  logAction('Izbrisano', schemas[schemaKey].label+' — '+id);
  persist(); renderMain();
}
function closeOverlay(id){ $('#'+id).classList.remove('show'); }

  if(t.dataset.edit!==undefined) openForm(t.dataset.schema, t.dataset.edit);
  else if(t.dataset.del!==undefined) deleteRecord(t.dataset.schema, t.dataset.del);
  else if(t.dataset.invoice!==undefined) createInvoiceFromPremium(t.dataset.invoice);
  else if(t.dataset.ajpes!==undefined) lookupAjpes(t.dataset.ajpes);
  else if(t.dataset.confirmpay!==undefined) confirmBankMatch(+t.dataset.confirmpay);
  else if(t.dataset.sign!==undefined) openSignModal(t.dataset.sign);
  else if(t.dataset.pay!==undefined) paySimulated(t.dataset.pay);
  else if(t.dataset.rmattach!==undefined) removeAttachment(+t.dataset.rmattach);
  else if(t.dataset.restorebackup!==undefined) restoreBackup(+t.dataset.restorebackup);
  else if(t.dataset.offerpdf!==undefined) offerPdf(t.dataset.offerpdf);
  else if(t.dataset.offer2pol!==undefined) offerToPolicy(t.dataset.offer2pol);
  else if(t.dataset.bmapply!==undefined) bmApply(t.dataset.bmapply);
  else if(t.dataset.approve!==undefined) approveSkoda(t.dataset.approve);
  else if(t.dataset.payout!==undefined) payoutSkoda(t.dataset.payout);
  else if(t.dataset.rate!==undefined) openRateModal(t.dataset.rate);
});

/* ================= AVTOMATIZACIJA RAČUNOV ================= */
function createInvoiceFromPremium(premijaId){
  const p = state.premije.find(r=>r._id===premijaId);
  if(!p) return;
  const pol = state.police.find(x=>x.id===p.polica);
  const izdaje = new Date();
  const rok = new Date(izdaje.getTime()+15*86400000);
  const novRacun = {_id:uid(), id:'RA-'+izdaje.getFullYear()+'-'+Math.floor(1000+Math.random()*9000),
    prejemnik: pol? pol.stranka : p.polica, znesek:p.znesek, ddv:'22%',
    datumIzdaje:fmtDateSl(izdaje), rokPlacila:fmtDateSl(rok), status:'odprto'};
  state.racuni.push(novRacun);
  logAction('Samodejno ustvarjen račun', novRacun.id+' iz premije '+p.polica);
  persist();
  current='racuni'; renderNav(); renderMain();
}
function lookupAjpes(strankaId){
  const s = state.stranke.find(r=>r._id===strankaId);
  if(!s) return;
  window.open('https://www.google.com/search?q='+encodeURIComponent('AJPES '+s.ime),'_blank');
}

/* ================= NOVI MODULI: TARIFA, PONUDBE, BONUS-MALUS, 4 OČI, UVOZ, NPS, ASISTENT ================= */
const PRAG_STIRI_OCI = 5000;
function fmtEur(n){ const [i,d]=(Math.round(n*100)/100).toFixed(2).split('.'); return i.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+d+' €'; }

/* --- 1. Kalkulator premij --- */
const CALC_CATS=[['starost','Starost voznika'],['regija','Regija'],['vozilo','Tip vozila'],['kritje','Kritje'],['fransiza','Franšiza']];
let calcRes=null;
function tarifeZa(kat){ return state.tarife.filter(t=>t.kategorija===kat); }
function calcHtml(){
  const sel=CALC_CATS.map(([k,l])=>`<div class="field"><label>${l}</label><select id="calc_${k}" onchange="calcUpdate()">${tarifeZa(k).map(t=>`<option value="${t._id}">${esc(t.vrednost)} (×${esc(t.faktor)})</option>`).join('')}</select></div>`).join('');
  const names=[...state.leads.map(l=>l.ime),...state.stranke.map(s=>s.ime)];
  return `<div class="two-col"><div class="panel"><h3>Parametri</h3>${sel}
    <div class="field"><label>Ime stranke (za ponudbo)</label><input id="calc_stranka" list="calc_list"><datalist id="calc_list">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div></div>
    <div class="panel"><h3>Izračun premije</h3><div id="calcOut"></div>
    <div class="actions" style="justify-content:flex-start"><button class="btn primary" onclick="calcSaveOffer()">Shrani kot ponudbo</button></div></div></div>
    <p class="note">Vrednosti in faktorje urejaš v modulu "Tarifne tabele". Kategorije: starost, regija, vozilo, kritje, fransiza. Zapis s kategorijo "osnova" določa osnovno premijo v €.</p>`;
}
function calcUpdate(){
  const out=$('#calcOut'); if(!out) return;
  const osn=state.tarife.find(t=>t.kategorija==='osnova');
  if(!osn){ out.innerHTML='<p class="note">V tarifnih tabelah manjka zapis s kategorijo "osnova".</p>'; calcRes=null; return; }
  let p=amountNum(osn.faktor); const lines=[`<tr><td>Osnovna premija</td><td></td><td>${fmtEur(p)}</td></tr>`]; const sel={};
  for(const [k,l] of CALC_CATS){
    const el=$('#calc_'+k); const t=state.tarife.find(x=>el && x._id===el.value); if(!t) continue;
    const f=parseFloat(String(t.faktor).replace(',','.'))||1; p*=f; sel[k]=t.vrednost;
    lines.push(`<tr><td>${l}: ${esc(t.vrednost)}</td><td>×${f}</td><td>${fmtEur(p)}</td></tr>`);
  }
  calcRes={premija:Math.round(p*100)/100, sel};
  out.innerHTML=`<table><tbody>${lines.join('')}</tbody></table><h2 style="margin-top:12px">${fmtEur(calcRes.premija)} / leto</h2>`;
}
function calcSaveOffer(){
  if(!calcRes){ alert('Najprej izberi parametre.'); return; }
  const ime=($('#calc_stranka').value||'').trim(); if(!ime){ alert('Vpiši ime stranke.'); return; }
  state.ponudbe.push({_id:uid(), id:'PON-'+new Date().getFullYear()+'-'+Math.floor(1000+Math.random()*9000), stranka:ime,

/* --- 7. Množični uvoz CSV --- */
const imp={schema:'police', rows:[], unknown:[], errors:[], fileName:''};
const DATE_KEYS=/^(potek|datum|rok|rokPlacila|datumIzdaje|datumSoglasja|rokHrambe|datumZaposlitve|veljavnost)$/;
function impSchemas(){ return Object.keys(schemas).filter(k=>!['uporabniki','strankeRacuni'].includes(k)); }
function parseCsv(text){
  text=String(text).replace(/^\uFEFF/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const delim=first.split(';').length>first.split(',').length?';':',';
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===delim){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); cur=''; rows.push(row); row=[]; }
    else cur+=c;
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function impSetSchema(v){ imp.schema=v; imp.rows=[]; imp.unknown=[]; imp.errors=[]; imp.fileName=''; renderMain(); }
function impFileChosen(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ impProcess(r.result,f.name); renderMain(); }; r.readAsText(f);
}
function impProcess(text,name){
  const sch=schemas[imp.schema]; const table=parseCsv(text);
  imp.fileName=name; imp.rows=[]; imp.errors=[]; imp.unknown=[];
  if(table.length<2){ imp.errors.push('Datoteka nima glave in vsaj ene vrstice podatkov.'); return; }
  const map=table[0].map(h=>{ h=h.trim(); const f=sch.fields.find(f=>f.k.toLowerCase()===h.toLowerCase()||f.l.toLowerCase()===h.toLowerCase()); if(!f&&h) imp.unknown.push(h); return f?f.k:null; });
  const firstKey=sch.fields[0].k; const seen=new Set();
  table.slice(1).forEach((cells,i)=>{
    const rec={}; sch.fields.forEach(f=>rec[f.k]='');
    map.forEach((k,j)=>{ if(k) rec[k]=(cells[j]||'').trim(); });
    const errs=[];
    if(!rec[firstKey]) errs.push('manjka "'+sch.fields[0].l+'"');
    else if(firstKey==='id'){ if(state[imp.schema].some(r=>r.id===rec.id)||seen.has(rec.id)) errs.push('podvojen '+sch.fields[0].l); seen.add(rec.id); }
    sch.fields.forEach(f=>{ if(DATE_KEYS.test(f.k) && rec[f.k] && rec[f.k]!=='—' && !parseDateSl(rec[f.k])) errs.push('"'+f.l+'" ni v obliki dd.mm.llll'); });
    imp.rows.push({rec, errs, line:i+2});
  });
}
function impTemplate(){
  const csv='\uFEFF'+schemas[imp.schema].fields.map(f=>f.l).join(';')+'\r\n';
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='predloga-'+imp.schema+'.csv'; a.click();
}
function impRun(){
  const ok=imp.rows.filter(r=>!r.errs.length); if(!ok.length) return;
  pushBackup(' (pred CSV uvozom)');
  ok.forEach(r=>state[imp.schema].push({_id:uid(), ...r.rec}));
  logAction('CSV uvoz', schemas[imp.schema].label+': '+ok.length+' vrstic'); persist();
  imp.rows=[]; imp.fileName=''; alert('Uvoženih vrstic: '+ok.length); renderMain();
}
function importHtml(){
  const sch=schemas[imp.schema]; const ok=imp.rows.filter(r=>!r.errs.length), bad=imp.rows.filter(r=>r.errs.length);
  return `<div class="panel"><h3>1. Izberi tabelo in datoteko</h3>
  <div class="toolbar"><select onchange="impSetSchema(this.value)" style="padding:8px;border:1px solid var(--line);border-radius:7px">${impSchemas().map(k=>`<option value="${k}" ${k===imp.schema?'selected':''}>${esc(schemas[k].label)}</option>`).join('')}</select>
  <button class="btn" onclick="impTemplate()">Prenesi predlogo (CSV)</button><input type="file" accept=".csv,text/csv" onchange="impFileChosen(event)"></div>
  <p class="note">Prva vrstica so imena stolpcev (naziv ali ključ polja). Ločilo ; ali , se zazna samodejno. Iz Excela: Shrani kot CSV. Polja: ${sch.fields.map(f=>esc(f.l)).join(', ')}.</p></div>
  ${imp.errors.map(e=>`<div class="panel"><span class="tag risk">${esc(e)}</span></div>`).join('')}
  ${imp.rows.length? `<div class="panel"><h3>2. Predogled — ${esc(imp.fileName)}</h3>
    <p class="note">Veljavnih vrstic: <b>${ok.length}</b> · z napako (preskočene): <b>${bad.length}</b>${imp.unknown.length? ' · neznani stolpci (prezrti): '+imp.unknown.map(esc).join(', ') : ''}</p>
    <table><thead><tr><th>Vrstica</th>${sch.fields.map(f=>`<th>${esc(f.l)}</th>`).join('')}<th>Preverjanje</th></tr></thead><tbody>
    ${imp.rows.slice(0,10).map(r=>`<tr><td>${r.line}</td>${sch.fields.map(f=>`<td>${esc(r.rec[f.k])}</td>`).join('')}<td>${r.errs.length? `<span class="tag risk">${esc(r.errs.join('; '))}</span>` : '<span class="tag ok">v redu</span>'}</td></tr>`).join('')}</tbody></table>
    ${imp.rows.length>10? `<p class="note">Prikazanih prvih 10 od ${imp.rows.length} vrstic.</p>`:''}
    ${bad.length>10? `<p class="note">Vrstice z napakami: ${bad.map(r=>r.line).join(', ')}</p>`:''}
    <div class="actions" style="justify-content:flex-start"><button class="btn primary" onclick="impRun()" ${ok.length?'':'disabled'}>Uvozi ${ok.length} veljavnih vrstic</button></div></div>` : ''}`;
}

function provizijaZa(z){ const sk=state.police.filter(p=>p.zastopnik===z.ime).reduce((a,p)=>a+amountNum(p.premija),0); return sk*(parseFloat(z.provizija)||0)/100; }
function localAnswer(q){
  const s=q.toLowerCase(), today=new Date(); today.setHours(0,0,0,0);
  const regije=[...new Set(state.police.map(p=>p.regija).filter(Boolean))];
  const reg=regije.find(r=>s.includes(r.toLowerCase().slice(0,Math.max(3,r.length-2))));
  const list=(a,f)=>a.length? '\n'+a.map(x=>'• '+f(x)).join('\n') : '';
  if(/polic/.test(s) && /poteč|potek/.test(s)){
    const mes=/ta mesec|tem mesecu/.test(s), teden=/teden/.test(s);
    let l=state.police.filter(p=>{ const d=parseDateSl(p.potek); if(!d) return false;
      if(mes) return d.getMonth()===today.getMonth()&&d.getFullYear()===today.getFullYear();
      const dd=(d-today)/86400000; return dd>=0&&dd<=(teden?7:30); });
    if(reg) l=l.filter(p=>p.regija===reg);
    return 'Polic, ki potečejo '+(mes?'ta mesec':teden?'v naslednjih 7 dneh':'v naslednjih 30 dneh')+(reg?' v regiji '+reg:'')+': '+l.length+'.'+list(l,p=>p.id+' — '+p.stranka+' ('+p.potek+')');
  }
  if(/škod/.test(s) && /nujn/.test(s)){ const l=state.skode.filter(x=>/nujn/i.test(x.prioriteta)); return 'Nujnih škod: '+l.length+'.'+list(l,x=>x.id+' — '+x.stranka+', '+x.vrednost+' ('+x.faza+')'); }
  if(/škod/.test(s) && /odprt|nerešen|aktiv|koliko/.test(s)){ const l=state.skode.filter(x=>!/izpla|zaklj/i.test(x.faza)); return 'Odprtih škodnih zahtevkov: '+l.length+' (vseh: '+state.skode.length+').'+list(l,x=>x.id+' — '+x.stranka+', '+x.vrsta+' ('+x.faza+')'); }
  if(/račun/.test(s) && /neplač|zamud|odprt|zapadl/.test(s)){ const l=state.racuni.filter(r=>/zamud|odprto/i.test(r.status)); return 'Neplačanih ali zapadlih računov: '+l.length+', skupaj '+fmtEur(l.reduce((a,r)=>a+amountNum(r.znesek),0))+'.'+list(l,r=>r.id+' — '+r.prejemnik+', '+r.znesek+' (rok '+r.rokPlacila+')'); }
  if(/provizij/.test(s)){ return 'Izračunane provizije zastopnikov:'+list(state.zastopniki,z=>z.ime+': '+fmtEur(provizijaZa(z)))+'\nSkupaj: '+fmtEur(state.zastopniki.reduce((a,z)=>a+provizijaZa(z),0)); }
  if(/nps|zadovoljstv/.test(s)){ const o=state.nps.map(n=>+n.ocena).filter(x=>!isNaN(x)); if(!o.length) return 'Ocen zadovoljstva še ni.'; const pr=o.filter(x=>x>=9).length, de=o.filter(x=>x<=6).length; return 'NPS: '+Math.round((pr-de)/o.length*100)+' (iz '+o.length+' ocen), povprečna ocena '+(o.reduce((a,b)=>a+b,0)/o.length).toFixed(1)+'.'; }
  if(/termin|obisk|ogled|danes|jutri/.test(s)){ const l=state.termini.filter(t=>{ const d=parseDateSl(t.datum); return d && d>=today && (d-today)/86400000<=(/danes/.test(s)?0:/jutri/.test(s)?1:7) && !/opravljen/i.test(t.status); }); return 'Terminov: '+l.length+'.'+list(l,t=>t.datum+' '+t.ura+' — '+t.vrsta+', '+t.oseba+' ('+t.povezava+')'); }
  const st=[...state.stranke.map(x=>x.ime),...state.police.map(x=>x.stranka)].find(n=>n && s.includes(n.toLowerCase()));

/* ================= BANČNA USKLADITEV ================= */
let bankLines=[];
function parseBankCsv(text){
  return text.split(/\r?\n/).filter(Boolean).slice(1).map(line=>{
    const parts = line.split(line.includes(';')?';':',');
    return {datum:(parts[0]||'').trim(), znesek:(parts[1]||'').trim(), opis:(parts[2]||'').trim()};
  });
}
function bankFileChosen(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ bankLines=parseBankCsv(r.result); renderMain(); };
  r.readAsText(f);
}
function amountNum(v){
  let s=String(v==null?'':v).replace(/[^\d,.-]/g,'');
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  return parseFloat(s)||0;
}
function confirmBankMatch(idx){
  const line=bankLines[idx]; if(!line) return;
  const racun = state.racuni.find(r=>r.status!=='plačano' && Math.abs(amountNum(r.znesek)-amountNum(line.znesek))<0.01);
  if(racun){ racun.status='plačano'; logAction('Uskladitev plačila', racun.id+' potrjen iz bančnega izpiska'); persist(); }
  bankLines.splice(idx,1); renderMain();
}

/* ================= OBVESTILA (rok opozorila) ================= */
function computeAlerts(){
  const today=new Date(); const alerts=[];
  state.police.forEach(p=>{ const d=parseDateSl(p.potek); if(d){ const days=Math.round((d-today)/86400000); if(days>=0 && days<=30) alerts.push({tip:'Polica poteka',besedilo:p.id+' ('+p.stranka+') poteče čez '+days+' dni',tag: days<=7?'risk':'wait'}); } });
  state.racuni.forEach(r=>{ const d=parseDateSl(r.rokPlacila); if(d && r.status!=='plačano'){ const days=Math.round((d-today)/86400000); if(days<=7) alerts.push({tip:'Račun',besedilo:r.id+' ('+r.prejemnik+') — rok plačila čez '+days+' dni',tag: days<0?'risk':'wait'}); } });
  state.naloge.forEach(n=>{ const d=parseDateSl(n.rok); if(d && !/zaklj|konč/i.test(n.status)){ const days=Math.round((d-today)/86400000); if(days<=7) alerts.push({tip:'Naloga',besedilo:n.naslov+' — rok čez '+days+' dni',tag: days<0?'risk':'wait'}); } });
  state.gdpr.forEach(g=>{ const d=parseDateSl(g.rokHrambe); if(d && d<today) alerts.push({tip:'GDPR',besedilo:'Rok hrambe podatkov za '+g.stranka+' je potekel ('+g.rokHrambe+')',tag:'risk'}); });
  state.termini.forEach(t=>{ const d=parseDateSl(t.datum); if(d && !/opravljen/i.test(t.status)){ const days=Math.round((d-today)/86400000); if(days>=0 && days<=2) alerts.push({tip:'Termin',besedilo:t.vrsta+' ('+t.povezava+') — '+t.datum+' ob '+t.ura+', '+t.oseba,tag:'wait'}); } });
  state.skode.forEach(k=>{ if(/izpla|zaklj/i.test(k.faza) && !state.nps.some(n=>n.skoda===k.id)) alerts.push({tip:'Anketa',besedilo:'Škoda '+k.id+' ('+k.stranka+') je zaključena — pošlji anketo o zadovoljstvu (stranka jo lahko izpolni tudi v portalu)',tag:'wait'}); });
  return alerts;
}

  <hr class="hr">
  <h3 style="font-size:15px">JSON datoteka</h3>
  <div class="actions" style="justify-content:flex-start">
    <button class="btn" onclick="downloadJson()">Prenesi JSON</button>
    <label class="btn" style="cursor:pointer">Uvozi JSON<input type="file" accept="application/json" style="display:none" onchange="importJson(event)"></label>
  </div>
  <hr class="hr">
  <h3 style="font-size:15px">Zgodovina in varnostne kopije (zadnjih 10)</h3>
  <button class="btn" onclick="createBackup()">Ustvari varnostno kopijo zdaj</button>
  <div style="margin-top:10px">${getBackups().length? getBackups().map((b,i)=>`<p style="font-size:12.5px">${esc(b.ts)} <button class="rowbtn" data-restorebackup="${i}">Obnovi</button></p>`).join('') : '<p class="note">Ni še varnostnih kopij. Pred vsakim prepisom podatkov (uvoz, GitHub, mapa) se ustvari samodejno.</p>'}</div>
  <div class="actions"><button class="btn" onclick="closeOverlay('adminOverlay')">Zapri</button></div>`;
  $('#adminOverlay').classList.add('show');
}
function getBackups(){ try{ return JSON.parse(localStorage.getItem('zavis_backups')||'[]'); }catch(e){ return []; } }
function pushBackup(label){
  const b=getBackups();
  b.unshift({ts:new Date().toLocaleString('sl-SI')+label, data:JSON.stringify(state)});
  while(b.length>10) b.pop();
  try{ localStorage.setItem('zavis_backups', JSON.stringify(b)); }catch(e){ alert('Ni dovolj prostora za varnostno kopijo (priponke so lahko prevelike).'); }
}
function createBackup(){ pushBackup(''); logAction('Varnostna kopija','Ročna kopija'); persist(); openAdmin(); }
function restoreBackup(idx){
  const item=getBackups()[idx]; if(!item) return;
  if(!confirm('Obnovim podatke iz kopije '+item.ts+'? Trenutno stanje se pred tem samodejno shrani.')) return;
  pushBackup(' (pred obnovitvijo)');
  state=JSON.parse(item.data); ensureState(); persist();
  logAction('Obnovitev','Obnovljeno iz kopije '+item.ts); renderNav(); renderMain(); closeOverlay('adminOverlay');
}
function b64EncodeUtf8(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64DecodeUtf8(str){ return decodeURIComponent(escape(atob(str))); }
async function ghLoad(){
  const repo=$('#gh_repo').value.trim(), path=$('#gh_path').value.trim(), branch=$('#gh_branch').value.trim()||'main', token=$('#gh_token').value.trim();
  const log=$('#ghlog'); log.textContent='Nalagam...'; saveGhCfg({repo,path,branch});
  try{
    const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}?ref=${branch}`,{headers:{Authorization:`token ${token}`,Accept:'application/vnd.github+json'}});
    if(!res.ok) throw new Error('HTTP '+res.status+' — preveri repo, pot in žeton');
    const data = await res.json();
    pushBackup(' (pred GitHub nalaganjem)'); state = JSON.parse(b64DecodeUtf8(data.content)); ensureState();
    persist(); logAction('GitHub','Podatki naloženi iz repozitorija'); renderNav(); renderMain();
    log.textContent='Podatki uspešno naloženi iz GitHub.';
  }catch(e){ log.textContent='Napaka: '+e.message; }
}
async function ghSave(){
  const repo=$('#gh_repo').value.trim(), path=$('#gh_path').value.trim(), branch=$('#gh_branch').value.trim()||'main', token=$('#gh_token').value.trim();
  const log=$('#ghlog'); log.textContent='Shranjujem...'; saveGhCfg({repo,path,branch});
  try{
    let sha;
    const head = await fetch(`https://api.github.com/repos/${repo}/contents/${path}?ref=${branch}`,{headers:{Authorization:`token ${token}`,Accept:'application/vnd.github+json'}});
    if(head.ok){ sha=(await head.json()).sha; }
    const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`,{
      method:'PUT', headers:{Authorization:`token ${token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
      body: JSON.stringify({message:'Posodobitev podatkov ŠČIT IS', content:b64EncodeUtf8(JSON.stringify(state,null,2)), branch, sha})
    });
    if(!res.ok) throw new Error('HTTP '+res.status+' — preveri pravice žetona (repo scope)');
    logAction('GitHub','Podatki shranjeni v repozitorij');
    log.textContent='Podatki uspešno shranjeni v GitHub.';
  }catch(e){ log.textContent='Napaka: '+e.message; }
}
async function pickFolder(){
  try{ dirHandle = await window.showDirectoryPicker(); $('#folderlog').textContent='Mapa izbrana: '+dirHandle.name; }
  catch(e){ $('#folderlog').textContent='Izbira preklicana.'; }
}
async function folderSave(){
  if(!dirHandle){ $('#folderlog').textContent='Najprej izberi mapo.'; return; }
  try{
    const fh = await dirHandle.getFileHandle('zavarovalnica.json',{create:true});
    const w = await fh.createWritable(); await w.write(JSON.stringify(state,null,2)); await w.close();
    logAction('Lokalna mapa','Podatki shranjeni v '+dirHandle.name);
    $('#folderlog').textContent='Shranjeno v mapo: '+dirHandle.name+'/zavarovalnica.json';
  }catch(e){ $('#folderlog').textContent='Napaka: '+e.message; }
}
async function folderLoad(){
  if(!dirHandle){ $('#folderlog').textContent='Najprej izberi mapo.'; return; }
  try{
    const fh = await dirHandle.getFileHandle('zavarovalnica.json');
    const file = await fh.getFile(); pushBackup(' (pred nalaganjem iz mape)'); state = JSON.parse(await file.text()); ensureState();
    persist(); logAction('Lokalna mapa','Podatki naloženi iz '+dirHandle.name); renderNav(); renderMain();
    $('#folderlog').textContent='Podatki naloženi iz mape.';
  }catch(e){ $('#folderlog').textContent='Napaka: '+e.message; }
}
function downloadJson(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='zavarovalnica.json'; a.click();
}
function importJson(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ pushBackup(' (pred uvozom JSON)'); state=JSON.parse(r.result); ensureState(); persist(); logAction('JSON uvoz','Podatki uvoženi iz datoteke'); renderNav(); renderMain(); alert('JSON uspešno uvožen.'); }catch(e){ alert('Napaka pri branju JSON: '+e.message); } };
  r.readAsText(f);
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape') ['formOverlay','adminOverlay'].forEach(closeOverlay); });
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('mousedown',e=>{ if(e.target===o) o.classList.remove('show'); }));
/* ================= ZAGON ================= */
function boot(){ renderNav(); renderMain(); }
if(session){ boot(); } else { showLogin(); }
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
